services:
  - type: web
    name: IA_Trader_Pro_Backend
    runtime: python
    pythonVersion: 3.11
    
    # Não deve estar em raiz, mas no backend mesmo
    rootDir: backend
    
    # Build
    buildCommand: pip install --no-cache-dir -r requirements.txt
    
    # Start - rapidíssimo
    startCommand: python main.py
    
    # Health check automático - READINESS endpoint
    healthCheckPath: /ready
    healthCheckTimeout: 10
    healthCheckInterval: 30
    
    # Recursos
    plan: starter

    # Variáveis
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GEMINI_API_KEY
        sync: false
      - key: CRYPTOCOMPARE_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
