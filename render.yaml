services:
  - type: web
    name: IA_Trader_Pro_Backend
    runtime: python
    pythonVersion: 3.11
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: PYTHONUNBUFFERED
        value: true
      - key: PORT
        value: 10000
    buildCommand: pip install --no-cache-dir -r requirements.txt
    buildFilter:
      ignoredPaths:
        - tensorboard_logs
        - .git
        - __pycache__
        - .env
